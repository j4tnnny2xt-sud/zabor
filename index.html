<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Заставки | Zabor_95</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00e5ff;
            font-size: 28px;
            margin-top: 20px;
        }
        p {
            color: #a0a0b0;
            font-size: 16px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #1a1a24;
            border-radius: 18px;
            padding: 12px;
            max-width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }
        .card-title {
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Мои Заставки 📱</h1>
    <p>Забор / Zabor_95 — Галерея топовых обоев</p>

    <div class="gallery">
        <!-- Заставка 1 -->
        <div class="card">
            <img src="https://picsum.photos/400/800?random=1" alt="Заставка">
            <div class="card-title">Заставка #1</div>
        </div>

        <!-- Заставка 2 -->
        <div class="card">
            <img src="https://picsum.photos/400/800?random=2" alt="Заставка">
            <div class="card-title">Заставка #2</div>
        </div>
    </div>

</body>
</html>
